<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 220" width="150" height="220">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#6e3531" />
      <stop offset="55%" stop-color="#4e2322" />
      <stop offset="100%" stop-color="#311415" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7dfa4" />
      <stop offset="50%" stop-color="#cfa564" />
      <stop offset="100%" stop-color="#9e783f" />
    </linearGradient>
    <pattern id="lattice" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 7 H 14 M 7 0 V 14" stroke="#e4c282" stroke-opacity="0.11" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Card body with antique gold rim -->
  <rect x="2" y="2" width="146" height="216" rx="10" fill="url(#bg)" stroke="url(#gold)" stroke-width="4" />

  <!-- Subtle diagonal damask lattice -->
  <rect x="8" y="8" width="134" height="204" rx="6" fill="url(#lattice)" />

  <!-- Ornate double inner gold frame -->
  <rect x="11" y="11" width="128" height="198" rx="5" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-opacity="0.85" />
  <rect x="16" y="16" width="118" height="188" rx="3" fill="none" stroke="#e5c384" stroke-width="0.9" stroke-opacity="0.55" />

  <!-- Corner diamonds -->
  <path d="M25 22 L29 27 L25 32 L21 27 Z" fill="#efd093" opacity="0.88" />
  <path d="M125 22 L129 27 L125 32 L121 27 Z" fill="#efd093" opacity="0.88" />
  <path d="M25 188 L29 193 L25 198 L21 193 Z" fill="#efd093" opacity="0.88" />
  <path d="M125 188 L129 193 L125 198 L121 193 Z" fill="#efd093" opacity="0.88" />

  <!-- Top & bottom filigree accents -->
  <path d="M55 27 H95 M65 32 H85" stroke="#e7c482" stroke-width="1.1" stroke-opacity="0.55" stroke-linecap="round" />
  <path d="M55 193 H95 M65 188 H85" stroke="#e7c482" stroke-width="1.1" stroke-opacity="0.55" stroke-linecap="round" />

  <!-- Center royal crest medallion -->
  <circle cx="75" cy="110" r="34" fill="#3a1919" stroke="url(#gold)" stroke-width="2" />
  <circle cx="75" cy="110" r="28" fill="none" stroke="#f0d399" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
  <path d="M75 84 L96 110 L75 136 L54 110 Z" fill="#592927" stroke="url(#gold)" stroke-width="1.8" />
  <path d="M75 94 L87 110 L75 126 L63 110 Z" fill="url(#gold)" />
  <path d="M75 101 L80 110 L75 119 L70 110 Z" fill="#431c1b" />
</svg>
