<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="The Ultimate Coup Logo">
  <defs>
    <linearGradient id="tuc-gold" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#fff2c6" />
      <stop offset="32%" stop-color="#ecc77d" />
      <stop offset="68%" stop-color="#c49449" />
      <stop offset="100%" stop-color="#8b6229" />
    </linearGradient>
    <linearGradient id="tuc-gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7da" />
      <stop offset="50%" stop-color="#f0cb82" />
      <stop offset="100%" stop-color="#b9873d" />
    </linearGradient>
    <radialGradient id="tuc-field" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#642628" />
      <stop offset="52%" stop-color="#361619" />
      <stop offset="100%" stop-color="#141e20" />
    </radialGradient>
    <radialGradient id="tuc-glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f7d894" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f7d894" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer royal crest shield (octagonal heraldic diamond-shield) -->
  <path
    d="M64 5 L112 25 L118 68 C116 96 93 114 64 123 C35 114 12 96 10 68 L16 25 Z"
    fill="url(#tuc-field)"
    stroke="url(#tuc-gold)"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Inner filigree bevel -->
  <path
    d="M64 12.5 L105.5 29.8 L110.5 67.5 C108.8 91.5 89 107.2 64 115.2 C39 107.2 19.2 91.5 17.5 67.5 L22.5 29.8 Z"
    fill="url(#tuc-glow)"
    stroke="url(#tuc-gold)"
    stroke-opacity="0.65"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- Corner starlight diamonds -->
  <path d="M64 17 L66.5 20 L64 23 L61.5 20 Z" fill="#fff0be" />
  <path d="M24 67 L27 69.5 L24 72 L21 69.5 Z" fill="#e7c184" opacity="0.8" />
  <path d="M104 67 L107 69.5 L104 72 L101 69.5 Z" fill="#e7c184" opacity="0.8" />

  <!-- Five-point Sovereign Crown (5 roles of the court) -->
  <g fill="url(#tuc-gold-bright)" stroke="#4c2c12" stroke-width="0.8" stroke-linejoin="round">
    <path d="M38 49 L34.5 34.5 L45 42 L51.5 31.5 L58 39.5 L64 26.5 L70 39.5 L76.5 31.5 L83 42 L93.5 34.5 L90 49 Z" />
    <rect x="39" y="51" width="50" height="4.2" rx="2" />
    <!-- Crown jewel tips -->
    <circle cx="34.5" cy="31.8" r="2.1" />
    <circle cx="51.5" cy="28.8" r="2.2" />
    <circle cx="64" cy="23.4" r="2.7" />
    <circle cx="76.5" cy="28.8" r="2.2" />
    <circle cx="93.5" cy="31.8" r="2.1" />
  </g>

  <!-- Sculpted imperial serif 'C' monogram -->
  <path
    d="M84.5 64.5
       C79.2 61.2 72.5 59.6 65.5 59.6
       C49.8 59.6 39.5 69.8 39.5 83.6
       C39.5 97.6 49.8 107.6 65.4 107.6
       C73.1 107.6 80.1 105.3 85.4 100.7
       L82.2 95.8
       C77.8 99.6 72.4 101.6 66.2 101.6
       C55.9 101.6 49.6 94.3 49.6 83.6
       C49.6 72.8 55.9 65.6 65.8 65.6
       C72.2 65.6 77.5 68.1 81.2 73.2
       L85.4 72.2
       Z"
    fill="url(#tuc-gold-bright)"
    stroke="#341812"
    stroke-width="1.15"
    stroke-linejoin="round"
  />

  <!-- Framed court dagger centered on shield axis (x=64) with clean breathing room -->
  <g>
    <!-- Pommel diamond -->
    <path d="M64 69.6 L66.6 72.2 L64 74.8 L61.4 72.2 Z" fill="#fff2c4" />
    <!-- Crossguard -->
    <path d="M56.2 77.6 L64 75.4 L71.8 77.6 L64 79.8 Z" fill="#fff3c9" stroke="#4a2812" stroke-width="0.6" stroke-linejoin="round" />
    <!-- Faceted blade -->
    <path d="M64 78.6 L67.2 80.6 L64 98.2 L60.8 80.6 Z" fill="url(#tuc-gold)" stroke="#3e2010" stroke-width="0.6" stroke-linejoin="round" />
    <path d="M64 79.8 L64 96.4" stroke="#fff7dc" stroke-width="0.9" stroke-opacity="0.75" />
  </g>
</svg>
